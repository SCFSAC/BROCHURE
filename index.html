<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Flipbook Responsivo</title>
    <script src="jquery.js"></script>
    <script src="turn.js"></script>
    <style>
        body { 
            background: #111; 
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw;
            overflow: hidden;
            position: fixed; 
            font-family: sans-serif;
        }
        
        .flipbook-viewport {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }

        .flipbook {
            margin: 0 auto;
            transition: margin 0.3s ease;
        }

        /* Estilo de cada página */
        .flipbook .page {
            background: #111; 
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .flipbook img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain; 
            display: block;
        }

        /* Ocultar scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Audio para el efecto de pasar página -->
    <audio id="audioFlip" src="images/página-flip.mp3" preload="auto"></audio>

    <script>
        $(window).ready(function() {
            var flipbook = $('.flipbook');
            var sound = document.getElementById("audioFlip");

            function loadFlipbook() {
                var w = $(window).width();
                var h = $(window).height();
                var finalW, finalH, displayMode;

                if (w < 600) { 
                    // MODO MÓVIL: Una sola hoja centrada
                    displayMode = 'single';
                    finalW = w * 0.92; // Casi todo el ancho
                    // Proporción vertical de una hoja (ajustable)
                    finalH = Math.min(h * 0.85, finalW * 1.4); 
                } else { 
                    // MODO PC: Doble hoja
                    displayMode = 'double';
                    finalW = Math.min(w * 0.9, 1200); 
                    finalH = Math.min(h * 0.9, 650);
                }

                if (flipbook.turn('is')) {
                    // Actualizar tamaño y modo si ya está iniciado
                    flipbook.turn('display', displayMode);
                    flipbook.turn('size', finalW, finalH);
                } else {
                    // Inicializar por primera vez
                    flipbook.turn({
                        width: finalW,
                        height: finalH,
                        display: displayMode,
                        autoCenter: true,
                        acceleration: true,
                        gradients: true,
                        elevation: 50,
                        duration: 800,
                        when: {
                            turning: function(event, page, view) {
                                if (sound) {
                                    sound.pause();
                                    sound.currentTime = 0;
                                    sound.play().catch(e => {});
                                }
                            }
                        }
                    });
                }
            }

            // Inicialización al cargar
            setTimeout(loadFlipbook, 100);

            // Ajuste en cambio de tamaño o rotación
            $(window).bind('resize', function() {
                loadFlipbook();
            });

            // Activar audio para navegadores móviles tras primer toque
            $(document).one('touchstart click', function() {
                if (sound) {
                    sound.play().then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(e => {});
                }
            });

            // Navegación con teclado
            $(document).keydown(function(e) {
                if (e.keyCode == 37) flipbook.turn("previous");
                if (e.keyCode == 39) flipbook.turn("next");
            });
        });
    </script>
