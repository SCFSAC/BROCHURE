    <style>
        /* Fondo y estructura general */
        body { 
            background: #111; 
            margin: 0; padding: 0;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden;
            position: fixed; 
            font-family: Arial, sans-serif;
        }
        
        .flipbook-viewport {
            width: 100%; 
            height: 100%;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        /* Contenedor del libro centrado */
        .flipbook {
            margin: 0 auto !important; 
            overflow: visible !important; 
        }

        /* Estilo de las páginas */
        .flipbook .page {
            background-color: #fff; /* Fondo blanco para las diapositivas */
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* Ajuste de imagen para evitar distorsión 4:3 */
        .flipbook img {
            width: 100% !important;
            height: 100% !important;
            display: block;
            object-fit: contain; /* Mantiene la proporción original */
            pointer-events: none;
        }
    </style>
</head>

    <script>
        $(window).ready(function() {
            var flipbook = $('.flipbook');
            var sound = document.getElementById("audioFlip");

            function loadFlipbook() {
                var w = $(window).width();
                var h = $(window).height();
                var finalW, finalH, displayMode;

                // RATIO 4:3 (Vertical 3/4 = 0.75)
                var ratioHoja = 0.75; 

                if (w < 600) { 
                    // MÓVIL: Una sola diapositiva
                    displayMode = 'single';
                    finalW = w * 0.92; 
                    finalH = finalW / ratioHoja;
                    
                    if (finalH > h * 0.85) {
                        finalH = h * 0.85;
                        finalW = finalH * ratioHoja;
                    }
                } else { 
                    // PC: Vista de libro (Doble página)
                    displayMode = 'double';
                    var maxH = h * 0.82; // Espacio vertical para no pegar al borde
                    finalH = Math.min(maxH, 580); 
                    finalW = (finalH * ratioHoja) * 2; 

                    if (finalW > w * 0.95) {
                        finalW = w * 0.95;
                        finalH = (finalW / 2) / ratioHoja;
                    }
                }

                if (flipbook.turn('is')) {
                    flipbook.turn('display', displayMode);
                    flipbook.turn('size', finalW, finalH);
                } else {
                    flipbook.turn({
                        width: finalW,
                        height: finalH,
                        display: displayMode,
                        autoCenter: true,
                        acceleration: true,
                        gradients: true,
                        elevation: 60, // Mejora la visibilidad de la esquina inteligente
                        duration: 800,
                        when: {
                            turning: function(event, page, view) {
                                if (sound) {
                                    sound.currentTime = 0;
                                    sound.play().catch(e => {});
                                }
                            }
                        }
                    });
                }
            }

            // Ejecución con pequeño retraso para asegurar el renderizado
            setTimeout(loadFlipbook, 150);

            $(window).bind('resize', function() {
                loadFlipbook();
            });

            // Desbloquear audio tras interactuar (política de navegadores)
            $(document).one('touchstart click', function() {
                if (sound) {
                    sound.play().then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(e => {});
                }
            });

            // Navegación con flechas del teclado
            $(document).keydown(function(e) {
                if (e.keyCode == 37) flipbook.turn("previous");
                if (e.keyCode == 39) flipbook.turn("next");
            });
        });
    </script>
