    <style>
        body { 
            background: #111; 
            margin: 0; padding: 0;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            min-height: 100vh; width: 100vw;
            overflow: hidden;
        }
        
        .flipbook-viewport {
            width: 100vw; height: calc(100vh - 80px); /* Espacio para los botones abajo */
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.3s ease;
        }

        .flipbook {
            margin: 0 auto !important; 
        }

        .flipbook .page {
            background-color: #fff;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        .flipbook img {
            width: 100% !important; height: 100% !important;
            display: block; object-fit: fill; pointer-events: none;
        }

        /* --- BARRA DE NAVEGACIÓN INFERIOR --- */
        .nav-container {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 20px;
            z-index: 1000;
        }

        .nav-button {
            background: #ffcc00; /* Amarillo Scaffold */
            color: #000; /* Texto Negro */
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            user-select: none;
        }

        .nav-button:hover {
            background: #e6b800;
            transform: scale(1.05);
        }

        .nav-button:active {
            transform: scale(0.95);
        }

        /* Zoom por doble clic */
        .zoomed {
            transform: scale(1.4);
            cursor: zoom-out;
        }
    </style>
</head>

    <script>
        $(window).ready(function() {
            var flipbook = $('.flipbook');
            var viewport = $('.flipbook-viewport');
            var sound = document.getElementById("audioFlip");

            function loadFlipbook() {
                var w = $(window).width();
                var h = $(window).height();
                var finalW, finalH, displayMode;

                var ratioHoja = 1.333; // 4:3 Horizontal

                if (w < 600) { 
                    displayMode = 'single';
                    finalW = w * 0.98; 
                    finalH = finalW / ratioHoja;
                    if (finalH > (h - 100) * 0.9) {
                        finalH = (h - 100) * 0.9;
                        finalW = finalH * ratioHoja;
                    }
                } else { 
                    displayMode = 'double';
                    var potentialW = w * 0.97;
                    var potentialH = (h - 100) * 0.95;

                    if (potentialW / (ratioHoja * 2) > potentialH) {
                        finalH = potentialH;
                        finalW = (finalH * ratioHoja) * 2;
                    } else {
                        finalW = potentialW;
                        finalH = (finalW / 2) / ratioHoja;
                    }
                }

                if (flipbook.turn('is')) {
                    flipbook.turn('display', displayMode);
                    flipbook.turn('size', finalW, finalH);
                } else {
                    flipbook.turn({
                        width: finalW, height: finalH,
                        display: displayMode,
                        autoCenter: true,
                        acceleration: true,
                        gradients: true,
                        elevation: 50,
                        duration: 800,
                        when: {
                            turning: function(event, page, view) {
                                if (sound) {
                                    sound.currentTime = 0;
                                    sound.play().catch(e => {});
                                }
                            }
                        }
                    });
                }
            }

            $('#prevBtn').click(function() { flipbook.turn('previous'); });
            $('#nextBtn').click(function() { flipbook.turn('next'); });

            viewport.on('dblclick dbltap', function() { $(this).toggleClass('zoomed'); });

            setTimeout(loadFlipbook, 100);
            $(window).bind('resize', loadFlipbook);

            $(document).one('touchstart click', function() {
                if (sound) {
                    sound.play().then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(e => {});
                }
            });
        });
    </script>
