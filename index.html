    <style>
        body { 
            background: #111; 
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; width: 100vw;
            overflow-x: hidden;
        }
        
        .flipbook-viewport {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.3s ease;
        }

        .flipbook {
            margin: 20px auto !important; 
            overflow: visible !important; 
        }

        .flipbook .page {
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .flipbook img {
            width: 100% !important;
            height: 100% !important;
            display: block;
            object-fit: fill; 
            pointer-events: none;
        }

        /* Clase para efecto de zoom por doble clic */
        .zoomed {
            transform: scale(1.5);
            cursor: zoom-out;
        }
    </style>
</head>

    <script>
        $(window).ready(function() {
            var flipbook = $('.flipbook');
            var viewport = $('.flipbook-viewport');
            var sound = document.getElementById("audioFlip");

            function loadFlipbook() {
                var w = $(window).width();
                var h = $(window).height();
                var finalW, finalH, displayMode;

                var ratioHoja = 1.333; // Ratio 4:3 horizontal

                if (w < 600) { 
                    displayMode = 'single';
                    finalW = w * 0.95; 
                    finalH = finalW / ratioHoja;
                    if (finalH > h * 0.8) {
                        finalH = h * 0.8;
                        finalW = finalH * ratioHoja;
                    }
                } else { 
                    displayMode = 'double';
                    var maxW = w * 0.90;
                    finalW = Math.min(maxW, 1100); 
                    finalH = (finalW / 2) / ratioHoja; 

                    if (finalH > h * 0.85) {
                        finalH = h * 0.85;
                        finalW = (finalH * ratioHoja) * 2;
                    }
                }

                if (flipbook.turn('is')) {
                    flipbook.turn('display', displayMode);
                    flipbook.turn('size', finalW, finalH);
                } else {
                    flipbook.turn({
                        width: finalW, height: finalH,
                        display: displayMode,
                        autoCenter: true,
                        acceleration: true,
                        gradients: true,
                        elevation: 50,
                        duration: 800,
                        when: {
                            turning: function(event, page, view) {
                                if (sound) {
                                    sound.currentTime = 0;
                                    sound.play().catch(e => {});
                                }
                            }
                        }
                    });
                }
            }

            // Zoom por doble clic/toque
            viewport.on('dblclick dbltap', function() {
                $(this).toggleClass('zoomed');
            });

            setTimeout(loadFlipbook, 150);
            $(window).bind('resize', loadFlipbook);

            $(document).one('touchstart click', function() {
                if (sound) {
                    sound.play().then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(e => {});
                }
            });
        });
    </script>
