    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flipbook Proporcional</title>
    <script src="jquery.js"></script>
    <script src="turn.js"></script>
    <style>
        body { 
            background: #111; 
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw;
            overflow: hidden;
            position: fixed; 
        }
        
        .flipbook-viewport {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        .flipbook {
            margin: 0 auto;
            overflow: visible !important; 
        }

        /* Cada página mantiene el color de fondo */
        .flipbook .page {
            background-color: #111;
        }

        /* Ajuste de imagen: 'contain' para que no se deforme, 
           pero el script ahora ajustará el contenedor al tamaño correcto */
        .flipbook img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill; /* Cambiado a fill para que llene el contenedor que ahora SÍ tiene la forma de la hoja */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <script>
        $(window).ready(function() {
            var flipbook = $('.flipbook');
            var sound = document.getElementById("audioFlip");

            function loadFlipbook() {
                var w = $(window).width();
                var h = $(window).height();
                var finalW, finalH, displayMode;

                // Definimos la proporción de tus imágenes (Ancho / Alto)
                // Si tus imágenes son más altas que anchas (verticales), el ratio es < 1
                // Ejemplo: 0.70 es una proporción común para hojas A4/Carta
                var ratioHoja = 0.70; 

                if (w < 600) { 
                    displayMode = 'single';
                    finalW = w * 0.85; 
                    finalH = finalW / ratioHoja; // El alto se calcula según la hoja
                    
                    // Si el alto calculado es mayor que la pantalla, ajustamos por alto
                    if (finalH > h * 0.8) {
                        finalH = h * 0.8;
                        finalW = finalH * ratioHoja;
                    }
                } else { 
                    displayMode = 'double';
                    // En PC el ancho total es de 2 hojas
                    var pcHeight = h * 0.85;
                    finalH = Math.min(pcHeight, 600);
                    finalW = (finalH * ratioHoja) * 2; 

                    // Si el ancho se pasa de la pantalla
                    if (finalW > w * 0.9) {
                        finalW = w * 0.9;
                        finalH = (finalW / 2) / ratioHoja;
                    }
                }

                if (flipbook.turn('is')) {
                    flipbook.turn('display', displayMode);
                    flipbook.turn('size', finalW, finalH);
                } else {
                    flipbook.turn({
                        width: finalW,
                        height: finalH,
                        display: displayMode,
                        autoCenter: true,
                        acceleration: true,
                        gradients: true,
                        elevation: 50,
                        duration: 800,
                        when: {
                            turning: function(event, page, view) {
                                if (sound) {
                                    sound.currentTime = 0;
                                    sound.play().catch(e => {});
                                }
                            }
                        }
                    });
                }
            }

            setTimeout(loadFlipbook, 200);

            $(window).bind('resize', function() {
                loadFlipbook();
            });

            $(document).one('touchstart click', function() {
                if (sound) {
                    sound.play().then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(e => {});
                }
            });
        });
    </script>
