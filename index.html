    <title>Flipbook Corregido</title>
    <script src="jquery.js"></script>
    <script src="turn.js"></script>
    <style>
        body { 
            background: #111; 
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw;
            overflow: hidden;
            position: fixed; 
        }
        
        .flipbook-viewport {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        /* CRUCIAL: El contenedor debe permitir que la esquina "sobresalga" durante la animación */
        .flipbook {
            margin: 0 auto;
            overflow: visible !important; 
        }

        /* Ajuste de las páginas para que coincidan con la esquina sensible */
        .flipbook .page {
            background-color: #111;
            background-size: 100% 100%;
            overflow: hidden;
        }

        /* Forzamos que la imagen ocupe TODO el div de la página sin dejar espacios */
        .flipbook img {
            width: 100% !important;
            height: 100% !important;
            display: block;
            pointer-events: none; /* Evita que la imagen interfiera con el clic de la esquina */
        }

        /* Sombra interna para dar profundidad al pliegue */
        .flipbook .shadow {
            -webkit-box-shadow: 0 0 20px rgba(0,0,0,0.5);
            -moz-box-shadow: 0 0 20px rgba(0,0,0,0.5);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>

    <script>
        $(window).ready(function() {
            var flipbook = $('.flipbook');
            var sound = document.getElementById("audioFlip");

            function loadFlipbook() {
                var w = $(window).width();
                var h = $(window).height();
                var finalW, finalH, displayMode;

                if (w < 600) { 
                    displayMode = 'single';
                    finalW = w * 0.85; // Un poco menos de ancho para que la esquina no toque el borde del cel
                    finalH = Math.min(h * 0.8, finalW * 1.4); 
                } else { 
                    displayMode = 'double';
                    finalW = Math.min(w * 0.9, 1100); 
                    finalH = Math.min(h * 0.85, 600);
                }

                if (flipbook.turn('is')) {
                    flipbook.turn('display', displayMode);
                    flipbook.turn('size', finalW, finalH);
                } else {
                    flipbook.turn({
                        width: finalW,
                        height: finalH,
                        display: displayMode,
                        autoCenter: true,
                        acceleration: true,
                        gradients: true,
                        elevation: 60, // Aumentamos la elevación para que la esquina sea más visible
                        duration: 1000,
                        when: {
                            turning: function(event, page, view) {
                                if (sound) {
                                    sound.currentTime = 0;
                                    sound.play().catch(e => {});
                                }
                            }
                        }
                    });
                }
            }

            setTimeout(loadFlipbook, 200);

            $(window).bind('resize', function() {
                loadFlipbook();
            });

            $(document).one('touchstart click', function() {
                if (sound) {
                    sound.play().then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(e => {});
                }
            });

            $(document).keydown(function(e) {
                if (e.keyCode == 37) flipbook.turn("previous");
                if (e.keyCode == 39) flipbook.turn("next");
            });
        });
    </script>
