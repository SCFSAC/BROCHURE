        body {

            align-items: center;     /* Centrado vertical */
            height: 100vh; 
            width: 100vw;
            overflow: hidden;
            position: fixed; 
        }
        
        .flipbook-viewport {
            width: 100%; 
            height: 100%;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        /* Ajuste para que el contenedor siempre esté en el centro real */
        .flipbook {
            display: inline-block;
            margin: 0 auto !important; 
            overflow: visible !important; 
        }

        .flipbook .page {
            background-color: #111;
        }

        .flipbook img {

            height: 100%;
            display: block;
            object-fit: fill; 
            pointer-events: none;

    <script>
        $(window).ready(function() {
            var flipbook = $('.flipbook');
            var sound = document.getElementById("audioFlip");

            function loadFlipbook() {
                var w = $(window).width();
                var h = $(window).height();
                var finalW, finalH, displayMode;

                // Mantenemos tu proporción de hoja
                var ratioHoja = 0.70; 

                if (w < 600) { 
                    displayMode = 'single';
                    finalW = w * 0.90; 
                    finalH = finalW / ratioHoja;
                    if (finalH > h * 0.85) {
                        finalH = h * 0.85;
                        finalW = finalH * ratioHoja;
                    }
                } else { 
                    displayMode = 'double';
                    // Para PC, calculamos que el ancho total sea el doble de una hoja
                    var maxH = h * 0.85;
                    finalH = Math.min(maxH, 600);
                    finalW = (finalH * ratioHoja) * 2; 

                    if (finalW > w * 0.95) {
                        finalW = w * 0.95;
                        finalH = (finalW / 2) / ratioHoja;
                    }
                }

                if (flipbook.turn('is')) {
                    flipbook.turn('display', displayMode);
                    flipbook.turn('size', finalW, finalH);
                } else {
                    flipbook.turn({
                        width: finalW,
                        height: finalH,
                        display: displayMode,
                        autoCenter: true, // Esto ayuda al centrado interno
                        acceleration: true,
                        gradients: true,
                        elevation: 50,
                        duration: 800,
                        when: {
                            turning: function(event, page, view) {
                                if (sound) {
                                    sound.currentTime = 0;
                                    sound.play().catch(e => {});
                                }
                            }
                        }
                    });
                }
            }

            // Un pequeño delay ayuda a que el navegador calcule bien el centro
            setTimeout(loadFlipbook, 150);

            $(window).bind('resize', function() {
                loadFlipbook();
            });

            $(document).one('touchstart click', function() {
                if (sound) {
                    sound.play().then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(e => {});
                }
            });
        });
    </script>
